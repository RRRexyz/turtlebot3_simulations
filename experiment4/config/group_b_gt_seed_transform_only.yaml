group_name: group_b_gt_seed_transform_only
display_name: B组：真值初始外参，仅刚体变换，不做 ICP
description: 使用 Gazebo 真值作为初始外参，只执行刚体变换完成对齐，不进行任何 ICP 精配准。

target_robot: tb3_1
source_robots:
  - tb3_2
  - tb3_3

registration:
  enabled: true
  use_gt_seed: true
  disable_overlap_crop: true
  disable_icp_refinement: true
  voxel_size: 0.05
  max_correspondence_distance: 0.15
  fitness_threshold: 0.30
  pose_match_radius: 0.75
  min_pose_correspondences: 8
  gt_match_max_dt: 0.05
  overlap_crop_distance: 0.30
  min_overlap_points: 200

global_fusion:
  voxel_size: 0.03
  outlier_nb_neighbors: 30
  outlier_std_ratio: 1.5
  normal_radius: 0.08
  poisson_depth: 9
  mesh_density_quantile: 0.04
  target_triangle_count: 250000
