global_frame: global_map
loop_hz: 2.0
tf_lookup_timeout: 0.2
map_stale_timeout: 5.0
move_base_server_wait_timeout: 1.0
goal_timeout: 60.0
blacklist_timeout: 45.0

assignment:
  distance_weight: 1.0
  information_gain_weight: 2.5
  conflict_penalty_weight: 3.0
  conflict_distance: 1.0

visualization:
  robot_markers_topic: /coordinator/robots
  frontier_markers_topic: /coordinator/frontiers
  goal_markers_topic: /coordinator/assignments

stopping_condition:
  enabled: true
  stop_confirm_cycles: 8
  map_growth_window_sec: 15.0
  known_cells_growth_abs_threshold: 80
  known_cells_growth_ratio_threshold: 0.005
  max_exploration_runtime_sec: 300.0
  max_failed_reassign_rounds: 10
  coverage_resolution: 0.1
  cancel_goals_on_finish: true
  publish_finished_topic: /exploration_finished
  publish_finish_reason_topic: /exploration_finish_reason
  publish_stop_debug_topic: /exploration_stop_debug
