# Gmapping 优化参数 - 针对多机器人地图合并
# 优化目标: 提高定位精度，减少累积误差，改善地图合并质量

# 地图更新频率 (降低提高实时性)
map_update_interval: 1.0  # 原: 2.0

# 激光雷达参数 (使用全量程)
maxUrange: 3.5  # 原: 3.0 - TurtleBot3 激光雷达最大量程
sigma: 0.05
kernelSize: 1

# 扫描匹配步长
lstep: 0.05
astep: 0.05

# 迭代次数 (提高匹配精度)
iterations: 10  # 原: 5 - 更多迭代提高精度

# 似然计算
lsigma: 0.075
ogain: 3.0
lskip: 0

# 匹配分数阈值 (提高要求减少误匹配)
minimumScore: 100  # 原: 50 - 更高阈值保证匹配质量

# 里程计噪声模型 (仿真环境里程计准确，降低噪声)
srr: 0.05  # 原: 0.1 - 平移->平移噪声
srt: 0.1   # 原: 0.2 - 平移->旋转噪声
str: 0.05  # 原: 0.1 - 旋转->平移噪声
stt: 0.1   # 原: 0.2 - 旋转->旋转噪声

# 更新阈值 (更频繁更新减少漂移)
linearUpdate: 0.3   # 原: 1.0 - 移动0.3米更新
angularUpdate: 0.15 # 原: 0.2 - 旋转0.15rad更新
temporalUpdate: 0.2 # 原: 0.5 - 每0.2秒更新

# 重采样阈值
resampleThreshold: 0.5

# 粒子数 (关键! 增加粒子提高精度)
particles: 200  # 原: 100 - 翻倍提高定位精度和稳定性

# 地图范围 (扩大适应house环境)
xmin: -14.4  # 原: -10.0
ymin: -14.4  # 原: -10.0
xmax: 14.4   # 原: 10.0
ymax: 14.4   # 原: 10.0

# 地图分辨率
delta: 0.05  # 5cm分辨率

# 似然采样
llsamplerange: 0.01
llsamplestep: 0.01
lasamplerange: 0.005
lasamplestep: 0.005
