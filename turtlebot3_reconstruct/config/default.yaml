data_root: ./data

robots:
  - tb3_1
  - tb3_2
  - tb3_3

camera:
  width: 640
  height: 480
  fx: 525.0
  fy: 525.0
  cx: 319.5
  cy: 239.5

depth:
  scale: 1000.0
  truncation_m: 3.5

keyframe:
  translation_m: 0.15
  rotation_deg: 10.0
  time_sec: 1.0

pointcloud_voxel_size: 0.03

icp:
  max_correspondence_distance: 0.08
  max_iteration: 50
  fitness_threshold: 0.3
  rmse_threshold: 0.05

colored_icp:
  max_correspondence_distance: 0.06
  max_iteration: 30
  lambda_geometric: 0.968

global_registration:
  voxel_size: 0.05
  normal_radius_factor: 2.0
  fpfh_radius_factor: 5.0
  ransac_distance_factor: 1.5
  ransac_n: 4
  ransac_max_iteration: 100000
  ransac_confidence: 0.999
  fgr_distance_factor: 1.0
  fitness_threshold: 0.05
  rmse_threshold: 0.2

cross_robot_candidate:
  max_translation_m: 1.5
  max_rotation_deg: 30.0
  min_overlap_ratio: 0.2

tsdf:
  voxel_length: 0.02
  sdf_trunc: 0.08
  color_type: RGB8

sync:
  max_time_diff_sec: 0.05

fragment:
  keyframes_per_fragment: 0

pose_graph_optimization:
  max_correspondence_distance: 0.1
  edge_prune_threshold: 0.25
  preference_loop_closure: 2.0
  reference_node: 0

export:
  dataset_root: ./data/dataset_root
  image_format: png
  bag_files:
    tb3_1: ./data/1.bag
    tb3_2: ./data/2.bag
    tb3_3: ./data/3.bag
  topics:
    rgb_image: /{robot_name}/camera/rgb/image_raw
    depth_image: /{robot_name}/camera/depth/image_raw
    odom: /{robot_name}/odom
    rgb_camera_info: /{robot_name}/camera/rgb/camera_info
    depth_camera_info: /{robot_name}/camera/depth/camera_info
